<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoneAI Admin</title>
<style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:10px;text-align:left}</style></head>
<body><h2>StoneAI - All Orders</h2><button onclick="loadOrders()">Refresh</button><div id="list">Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const c = supabase.createClient('https://djqkvofoutmjetvcnecv.supabase.co','sb_publishable_MgJza0BQSlcxIzpC0bat-w_jxmdCYE6');
async function loadOrders(){
  const {data} = await c.from('orders').select('*').order('created_at',{ascending:false});
  let h='<table><tr><th>Name</th><th>Service</th><th>Amount</th><th>Details</th><th>Date</th></tr>';
  data.forEach(o=>{ h+=`<tr><td>${o.customer_name}</td><td>${o.service}</td><td>₦${o.amount}</td><td>${o.details}</td><td>${new Date(o.created_at).toLocaleString()}</td></tr>` });
  document.getElementById('list').innerHTML=h+'</table>';
}
loadOrders();
</script></body></html>
