<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoneAI Bank - Billpoint Style</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f2f2f7;color:#000;padding-bottom:90px}
.top{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900}
.login{background:#6a00ff;color:#fff;border:none;padding:9px 16px;border-radius:20px;font-weight:800;cursor:pointer}
.hero{background:linear-gradient(135deg,#0f0c29,#302b63,#6a00ff);margin:14px 20px;padding:20px;border-radius:18px;color:#fff}
.hero small{color:#ddd}
.hero h2{font-size:28px;margin:6px 0}
.hero p{font-size:12px;color:#ddd}
.btnrow{display:flex;gap:10px;padding:0 20px}
.btnrow button{flex:1;padding:15px;border-radius:14px;font-weight:800;border:none;cursor:pointer;color:#fff;font-size:15px}
.green{background:#10b981}.purple{background:#8b5cf6}
.title{padding:18px 20px 10px;font-size:16px;font-weight:900}
.adverts{padding:0 20px}
.advert{display:none;border-radius:16px;padding:16px}
.advert.active{display:block}
.advert h3{font-size:17px}.advert p{font-size:12px;margin-top:6px}
.advert button{margin-top:10px;background:#fff;color:#000;border:none;padding:9px 14px;border-radius:20px;font-weight:800;cursor:pointer}
.ad1{background:linear-gradient(135deg,#ff6b00,#ffcc00)}
.ad2{background:linear-gradient(135deg,#00c853,#00e5ff)}
.ad3{background:linear-gradient(135deg,#ff1744,#6a00ff);color:#fff}
.dots{text-align:center;margin-top:8px}
.dots span{display:inline-block;width:8px;height:8px;background:#ccc;border-radius:50%;margin:0 3px;cursor:pointer}
.dots span.active{background:#6a00ff;width:20px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 20px}
.card{background:#fff;border-radius:16px;padding:16px 6px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card:active{transform:scale(.95)}
.card div{font-size:28px}
.card p{font-size:11px;margin-top:6px;font-weight:800}
.list{margin:0 20px;background:#fff;border-radius:16px;padding:6px 14px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}
.row:last-child{border:none}
.row b{font-size:13px}
.row small{color:#888}
.footer{text-align:center;font-size:11px;color:#888;padding:20px}
/* BOTTOM NAV - THIS IS THE BOTTOM */
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid #ddd;z-index:99}
.bottom div{text-align:center;cursor:pointer;font-size:11px;font-weight:800;color:#888}
.bottom div.active{color:#6a00ff}
.bottom div span{font-size:22px;display:block}
/* POPUP */
.popup{display:none;
