<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoneAI</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:450px;margin:auto;box-shadow:0 2px 10px #0001}
h1{text-align:center}
.service{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0;cursor:pointer}
.service.selected{border:2px solid #000;background:#f0f0f0}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#000;color:#fff;border:none;font-weight:bold}
#msg{text-align:center;color:green}
</style>
</head>
<body>
<div class="card">
<h1>🪨 StoneAI</h1>
<p style="text-align:center">Order stone services - Fast & Reliable</p>

<div class="service selected" onclick="pick('Stone Design',400,this)">Stone Design - <b>₦400</b></div>
<div class="service" onclick="pick('Stone Delivery',1000,this)">Stone Delivery - <b>₦1000</b></div>
<div class="service" onclick="pick('Stone Installation',5000,this)">Stone Installation - <b>₦5000</b></div>

<input id="name" placeholder="Your Full Name">
<input id="phone" placeholder="Your Phone Number">
<input id="address" placeholder="Your Address / Location">

<button onclick="placeOrder()">Place Order</button>
<p id="msg"></p>
<p style="text-align:center;font-size:12px">Your order is saved securely. We will contact you.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://djqkvofoutmjetvcnecv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MgJza0BQSlcxIzpC0bat-w_jxmdCYE6';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedService = 'Stone Design';
let selectedAmount = 400;

function pick(service, amount, el){
  selectedService = service; selectedAmount = amount;
  document.querySelectorAll('.service').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
}

async function placeOrder(){
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const address = document.getElementById('address').value;
  if(!name || !phone){ alert('Please enter name and phone'); return; }

  document.getElementById('msg').innerText = 'Saving order...';

  const { error } = await supabaseClient.from('orders').insert([{
    customer_name: name,
    service: selectedService,
    amount: selectedAmount,
    details: JSON.stringify({phone, address}),
    status: 'pending'
  }]);

  if(error){ document.getElementById('msg').innerText = 'Error: ' + error.message; }
  else{
    document.getElementById('msg').innerText = '✅ Order Saved! We will contact you soon.';
    document.getElementById('name').value=''; document.getElementById('phone').value=''; document.getElementById('address').value='';
  }
}
</script>
</body>
</html>
